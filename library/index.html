<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seref Baba's Remote Library</title>
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="A private study. Books stay in this browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="wordmark" href="." id="home">Seref Baba<span>Remote Library</span></a>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Title, author, tags, the card" autocomplete="off" spellcheck="false">
        <span class="search-slash" aria-hidden="true">/</span>
      </div>
      <div class="tools">
        <button class="tool" id="view-grid" type="button" aria-pressed="true">Grid</button>
        <button class="tool" id="view-list" type="button" aria-pressed="false">List</button>
        <button class="theme-toggle" id="theme" type="button">Night</button>
      </div>
    </header>
    <main class="stage">
      <div class="empty" id="empty">
        <p class="lead">The lamp is on.</p>
        <p>The desk is clear. Leave a book anywhere in the room.</p>
        <p>Nothing here is a feed. <em>Night in the study.</em></p>
      </div>
      <ul class="shelf" id="shelf"></ul>
    </main>
  </div>

  <div class="detail" id="detail" hidden>
    <div class="detail-bar">
      <button class="tool" id="detail-close" type="button">Back to the shelf</button>
    </div>
    <div class="detail-body">
      <div class="detail-cover" id="detail-cover"></div>
      <div class="detail-copy">
        <h1 class="detail-title" id="detail-title"></h1>
        <p class="detail-biblio" id="detail-biblio"></p>
        <div class="verdict-row">
          <p class="verdict" id="verdict"></p>
          <button class="regen" id="regen" type="button" hidden>Regenerate</button>
        </div>
        <div class="summary" id="summary"></div>
        <button class="show-more" id="show-more" type="button" hidden>Show more</button>
        <div class="thread-wrap" id="thread-wrap">
          <div class="thread-inner">
            <ul class="thread" id="thread"></ul>
          </div>
        </div>
        <div class="actions">
          <button class="btn-fill" id="open-reader" type="button">Open the book</button>
          <button class="btn-quiet" id="ocr" type="button" hidden>OCR this book</button>
        </div>
        <p class="note" id="detail-note"></p>
      </div>
    </div>
  </div>

  <div class="reader" id="reader" hidden>
    <div class="reader-bar">
      <button class="tool" id="reader-close" type="button">Close</button>
      <button class="tool" id="page-prev" type="button">Previous</button>
      <button class="tool" id="page-next" type="button">Next</button>
      <span class="page-label" id="page-label"></span>
    </div>
    <div class="reader-stage" id="reader-stage">
      <canvas id="reader-canvas"></canvas>
    </div>
  </div>

  <div class="drop-veil" id="veil" aria-hidden="true"><p>On the table.</p></div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="boot.js"></script>
</body>
</html>
