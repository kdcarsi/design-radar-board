<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAT-KEM RADAR</title>
  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div id="gate" class="gate" hidden>
    <div class="gate-inner">
      <div class="gate-mark">NAT-KEM<br>RADAR</div>
      <form id="gate-form" class="gate-form" autocomplete="off">
        <input id="gate-key" type="password" name="key" spellcheck="false" autocapitalize="off" enterkeyhint="go" aria-label="Key">
        <button type="submit" class="gate-go">ENTER</button>
      </form>
    </div>
  </div>
  <header class="top">
    <nav class="tabs" aria-label="Views">
      <button type="button" id="tab-radar" class="on">NAT-KEM RADAR</button>
      <div class="status">
        <button type="button" id="kept-label">0 kept</button>
      </div>
      <button type="button" id="tab-profile">MOODBOARD</button>
    </nav>
  </header>
  <div id="radar-view">
    <nav class="days" id="days" aria-label="Recent days"></nav>
    <section class="band" aria-labelledby="today-title">
      <h2 id="today-title">Today's Top 10</h2>
      <div class="today-grid" id="today"></div>
      <p class="empty" id="today-empty" hidden>No picks for this day.</p>
    </section>
  </div>
  <div id="profile-view" hidden>
    <section class="band" aria-labelledby="board-title">
      <h2 id="board-title">MOODBOARD</h2>
      <div class="board-grid" id="board"></div>
      <p class="empty" id="board-empty">Nothing kept yet.</p>
    </section>
  </div>
  <div class="pop" id="pop" hidden>ADDED</div>
  <div class="toast" id="toast" hidden>
    <span id="toast-msg">Removed.</span>
    <button type="button" id="undo">Undo</button>
  </div>
  <script src="app.js?v=10"></script>
</body>
</html>
